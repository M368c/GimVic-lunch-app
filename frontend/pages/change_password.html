<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="change_password_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Kosilo - Gimnazija Vič</title>
</head>
<body>
    <div class="top-header">
        <img src="../images/gimvic-logo.png" id="gimvic-logo">
        <div class="user">
            <span id="user-computer"></span>
            <div class="user-button">
                <img src="../images/user_profile.png" id="user-profile">
            </div>
        </div>
    </div>

    <div class="main_container">
        <label id="main_label">Spremeni geslo</label>
        <div class="current_password">
            <label id="current_password_text">Trenutno geslo</label>
            <input type="password" id="current_password_input">
        </div>
        <div class="new_password">
            <label id="new_password_text">Novo geslo</label>
            <input type="password" id="new_password_input">
        </div>
        <div class="again_new_password">
            <label id="again_new_password_text">Novo geslo (ponovno)</label>
            <input type="password" id="again_new_password_input">
        </div>
        <div class="buttons">
            <button id="submit_password_changes">Shrani spremembe</button>
            <button id="cancel_password_changes">Prekliči</button>
        </div>
    </div>
    <style src="change_password.js"></style>
</body>
</html>
