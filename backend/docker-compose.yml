version: '3.8'
services:
  db:
    image: postgres:17
    container_name: my_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/0000_init_up.sql:/0000_init_up.sql
  adminer:
    image: adminer
    container_name: my_adminer
    ports:
      - "8888:8080"
    environment:
      ADMINER_DESIGN: nette
    depends_on:
      - db

volumes:
  pgdata: