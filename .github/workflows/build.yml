name: Build and Push to GHRC

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  build-and-push-images:
    name: Build docker images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Get the version
      - name: Get the tag name
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      # Extract docker images metadata
      - name: Extract Docker image metadata
        id: nginx-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/nginx
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Extract Docker image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # Build docker images and push to GHCR
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.get_version.outputs.REPO_LOWER }}/backend:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ steps.get_version.outputs.REPO_LOWER }}/backend:latest

      - name: Build and push ngnix image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.get_version.outputs.REPO_LOWER }}/nginx:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ steps.get_version.outputs.REPO_LOWER }}/nginx:latest
